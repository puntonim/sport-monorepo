        deep squat, a gamba singola e su un rialzo, aiutandomi con le braccia. Al
        momento ho sentito il ginocchio cliccare e un po'' in disordine, ma ho continuato
        perch\u00e9 pensavo mi facesse bene: non riesco ancora ad imprimere quasi
